<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop - Bazaar Lane</title>
  <meta name="description" content="Hand-made goods from independent shops.">
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-customer-header></header>

  <main class="shop-main">
    <div id="message" class="message" role="alert"></div>

    <section id="shop" class="hidden">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a> <span aria-hidden="true">›</span> <span id="crumb-name">Shop</span></nav>
      <div class="card shop-intro">
        <h1 id="shop-name"></h1>
        <p id="shop-city" class="vendor-line"></p>
        <div id="shop-rating"></div>
        <p id="shop-description" class="description"></p>
        <ul id="shop-facts" class="facts"></ul>
      </div>
      <nav id="shop-categories" class="chips" aria-label="Categories in this shop"></nav>
      <h2 id="products-title">All products</h2>
      <p id="view-links" class="view-links small"></p>
      <div id="carousel-host"></div>
      <div id="products" class="product-grid"></div>
      <p id="no-products" class="muted hidden">Nothing here yet.</p>
    </section>

    <section id="not-available" class="card status-card hidden">
      <div class="status-icon" data-icon="alert" aria-hidden="true"></div>
      <h2>This shop is not available</h2>
      <p class="muted">It may be closed for now, or the address is wrong.</p>
      <p><a href="/">See all shops</a></p>
    </section>
  </main>

  <footer class="site-footer" data-customer-footer></footer>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
  <script src="/carousel.js" defer></script>
    <script src="/store.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My orders - Bazaar Lane</title>
  <meta name="description" content="Hand-made goods from independent shops.">
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-customer-header></header>

  <main class="shop-main narrow-wide">
    <h1>My orders</h1>
    <p class="muted">The orders placed in this browser. Each one opens its private tracking page.</p>
    <div id="order-list"></div>
    <section id="no-orders" class="card status-card hidden">
      <div class="status-icon" data-icon="bag" aria-hidden="true"></div>
      <h2>No orders on this device yet</h2>
      <p class="muted">When you place an order here, it is listed on this page.</p>
      <p><a href="/">Start shopping</a></p>
    </section>
  </main>

  <footer class="site-footer" data-customer-footer></footer>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
  <script src="/orders.js" defer></script>
</body>
</html>

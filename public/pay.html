<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay (test) - Bazaar Lane</title>
  <meta name="description" content="Hand-made goods from independent shops.">
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-customer-header></header>

  <main class="shop-main narrow">
    <section class="card pay-box" aria-labelledby="pay-title">
      <p class="vendor-line">FakePay · test mode, no real money</p>
      <h1 id="pay-title">Pay for your order</h1>
      <div id="message" class="message" role="alert"></div>
      <div id="pay-details" class="hidden">
        <p id="pay-code" class="muted"></p>
        <p class="big-price" id="pay-amount"></p>
        <div class="pay-buttons">
          <button type="button" class="accent wide" data-outcome="upi">Pay with UPI (test)</button>
          <button type="button" class="secondary wide" data-outcome="card">Pay with card (test)</button>
          <button type="button" class="secondary wide" data-outcome="fail">Fail (test)</button>
        </div>
        <p class="muted small">This page plays the part of a payment company. Its answer is signed with a secret only the server knows, and the server checks it before your order counts as paid.</p>
      </div>
      <p id="after-links" class="hidden"></p>
    </section>
  </main>

  <footer class="site-footer" data-customer-footer></footer>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
      <script src="/pay.js" defer></script>
</body>
</html>

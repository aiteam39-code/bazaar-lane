<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Bazaar Lane</title>
  <meta name="description" content="Hand-made goods from independent shops.">
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-customer-header></header>

  <main class="shop-main narrow-wide help-page">
    <section class="card status-card">
      <div class="status-icon" data-icon="alert" aria-hidden="true"></div>
      <h1>We could not find that page</h1>
      <p>The address may be mistyped, or the page has moved. Try a search, or start from the home page.</p>
      <form class="search-row" action="/search" method="get" role="search">
        <label for="lost-search" class="visually-hidden">Search products</label>
        <input id="lost-search" name="search" type="search" maxlength="60" placeholder="Search pickles, pots, stoles">
        <button type="submit" class="accent">Search</button>
      </form>
      <p><a href="/">Go to the home page</a></p>
    </section>
  </main>

  <footer class="site-footer" data-customer-footer></footer>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
    </body>
</html>

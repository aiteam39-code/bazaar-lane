<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Bazaar Lane</title>
  <meta name="description" content="Hand-made goods from independent shops.">
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-customer-header></header>

  <main class="shop-main narrow-wide help-page">
    <h1>Contact us</h1>
    <p>Questions about an order are fastest through "Help with this order" on your tracking page. For anything else, write to us here. We reply within 2 working days.</p>
    <form id="contact-form" class="card" novalidate>
      <div class="field"><label for="contact-name">Your name</label><input id="contact-name" maxlength="60" autocomplete="name" required></div>
      <div class="field"><label for="contact-email">Your email</label><input id="contact-email" type="email" maxlength="100" autocomplete="email" required></div>
      <div class="field"><label for="contact-message">Your message</label><textarea id="contact-message" rows="5" maxlength="2000" required></textarea></div>
      <div id="contact-note" class="message" role="status"></div>
      <button type="submit" class="accent">Send message</button>
    </form>
  </main>

  <footer class="site-footer" data-customer-footer></footer>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
      <script src="/help/contact.js" defer></script>
</body>
</html>

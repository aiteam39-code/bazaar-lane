<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payouts - Bazaar Lane</title>
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-staff-header="admin"></header>

  <main>
    <h1>Payouts</h1>
    <p class="muted">Each shop's balance: what the platform owes it (earnings from online orders) minus the commission it owes (cash on delivery orders) minus payouts. Recording a payout does not send money: it records money you paid outside the app.</p>
    <div id="message" class="message" role="status"></div>
    <p class="kpi-line">Payouts due: <span id="due" class="kpi"></span></p>
    <div id="shop-list"></div>
    <h2>Recent payouts</h2>
    <ul id="payout-list" class="plain-list"></ul>
  </main>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
  <script src="/admin/payouts.js" defer></script>
</body>
</html>

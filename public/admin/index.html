<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Bazaar Lane</title>
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-staff-header="admin"></header>

  <main>
    <h1>Dashboard</h1>
    <p class="muted">The whole marketplace today. Updates every 5 seconds.</p>
    <div id="message" class="message" role="alert"></div>
    <div id="tiles" class="tiles"></div>
    <h2>Seller orders by status</h2>
    <p class="muted small">Open orders are always counted; delivered, rejected and cancelled ones on the day they finished.</p>
    <div id="status-tiles" class="tiles small-tiles"></div>
    <div class="two-tables">
      <section aria-labelledby="top-shops-title"><h2 id="top-shops-title">Top 5 shops this week</h2><ol id="top-shops" class="rank-list"></ol></section>
      <section aria-labelledby="top-categories-title"><h2 id="top-categories-title">Top 5 categories this week</h2><ol id="top-categories" class="rank-list"></ol></section>
    </div>
    <h2>Go to</h2>
    <nav id="big-links" class="big-links"></nav>
  </main>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
  <script src="/admin/home.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outbox - Bazaar Lane</title>
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-staff-header="admin"></header>

  <main>
    <h1>Outbox</h1>
    <p class="muted">Every email the marketplace would send. Nothing is really sent: a real email service can be added later.</p>
    <div id="message" class="message" role="status"></div>
    <div class="outbox">
      <section aria-label="Emails"><p id="email-count" class="muted"></p><ul id="email-list" class="email-list"></ul></section>
      <section id="email-open" class="card hidden" aria-live="polite">
        <h2 id="email-subject"></h2>
        <p class="muted small" id="email-meta"></p>
        <pre id="email-body" class="email-body"></pre>
      </section>
    </div>
  </main>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
  <script src="/admin/outbox.js" defer></script>
</body>
</html>

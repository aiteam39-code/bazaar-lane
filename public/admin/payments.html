<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments - Bazaar Lane</title>
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-staff-header="admin"></header>

  <main>
    <h1>Payments</h1>
    <p class="muted" id="provider-line"></p>
    <div id="message" class="message" role="status"></div>
    <section class="card" aria-labelledby="switch-title">
      <h2 id="switch-title">Cash on delivery</h2>
      <p id="cod-state"></p>
      <button type="button" id="cod-toggle" class="secondary"></button>
    </section>
    <section class="card" aria-labelledby="expiry-title">
      <h2 id="expiry-title">Unpaid orders</h2>
      <p class="muted">An online order not paid within 30 minutes is cancelled and its stock goes back. This runs by itself every minute.</p>
      <button type="button" id="run-expiry" class="secondary">Run the 30-minute check now</button>
    </section>
    <section id="refund-due-box" class="card problems hidden" aria-labelledby="refund-due-title">
      <h2 id="refund-due-title">Refund failed, try again</h2>
      <div id="refund-due"></div>
    </section>
    <h2>Every payment</h2>
    <div id="payment-list"></div>
    <p id="no-payments" class="muted hidden">No online payments yet.</p>
  </main>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
  <script src="/admin/payments.js" defer></script>
</body>
</html>

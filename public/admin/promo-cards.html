<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promo cards - Bazaar Lane</title>
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-staff-header="admin"></header>

  <main>
    <h1>Promo cards</h1>
    <p class="muted">The row of cards under the home page banner. Switch a card off to hide it, change its words, colour, link or photo. A link must be a page of this store.</p>
    <div id="message" class="message" role="status"></div>
    <div id="card-list"></div>

    <h2>Category tile photos</h2>
    <p class="muted">Each tile in "Shop by category" uses its own photo, or else a photo of one of its products.</p>
    <ul id="tile-list" class="tile-admin-list"></ul>
  </main>

</html>

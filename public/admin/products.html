<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All products - Bazaar Lane</title>
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-staff-header="admin"></header>

  <main>
    <h1>All products</h1>
    <form id="search-form" class="search-row" role="search" novalidate>
      <label for="search" class="visually-hidden">Search a product or a shop</label>
      <input id="search" type="search" maxlength="60" placeholder="Search a product or a shop" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <p id="counts" class="muted"></p>
    <div id="message" class="message" role="status"></div>
    <div id="product-list" class="grid"></div>
    <p id="empty" class="muted hidden">No products found.</p>
  </main>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
  <script src="/admin/products.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your bag - Bazaar Lane</title>
  <meta name="description" content="Hand-made goods from independent shops.">
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-customer-header></header>

  <main class="shop-main">
    <ol class="steps" aria-label="Checkout steps"><li class="is-current" aria-current="step">Bag</li><li>Details</li><li>Pay</li><li>Done</li></ol>
    <h1>Your bag</h1>
    <div id="message" class="message" role="alert"></div>

    <section id="problems" class="card problems hidden" aria-labelledby="problems-title">
      <h2 id="problems-title">Please check these products</h2>
      <div id="problem-list"></div>
    </section>

    <div id="undo-row" class="undo-row hidden" role="status"></div>
    <div id="cart-groups"></div>

    <section id="cart-summary" class="card cart-summary hidden" aria-label="Order total">
      <div class="total-row"><span>All items</span><span id="sum-items"></span></div>
      <div class="total-row"><span>All shipping</span><span id="sum-shipping"></span></div>
      <div class="total-row grand"><span>Grand total</span><span id="sum-grand"></span></div>
      <p id="fix-first" class="muted small hidden">Please fix the products at the top first.</p>
      <a id="to-checkout" class="button accent wide" href="/checkout.html">Go to checkout</a>
    </section>

    <section id="cart-empty" class="card status-card hidden">
      <div class="status-icon" data-icon="bag" aria-hidden="true"></div>
      <h2>Your bag is empty</h2>
      <p><a href="/search?sort=newest">Start shopping</a></p>
    </section>
  </main>

  <footer class="site-footer" data-customer-footer></footer>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
      <script src="/cart.js" defer></script>
</body>
</html>

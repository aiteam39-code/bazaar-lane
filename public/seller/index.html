<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My shop - Bazaar Lane</title>
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-staff-header="seller"></header>

  <main>
    <h1 id="shop-title">My shop</h1>
    <div id="message" class="message" role="alert"></div>
    <section id="status-card" class="card status-card">
      <p class="muted">Loading...</p>
    </section>
    <section id="dashboard" class="hidden" aria-label="Your shop today">
      <div id="tiles" class="tiles"></div>
      <section id="low-box" class="card banner-low hidden" aria-labelledby="low-title">
        <h2 id="low-title">LOW stock</h2>
        <ul id="low-list" class="plain-list"></ul>
      </section>
      <section class="card" aria-label="Sales by week"><div id="sales-chart"></div></section>
    </section>
    <nav id="shop-links" class="big-links hidden">
      <a class="card big-link" href="/seller/orders.html"><span>Orders</span><span id="orders-badge" class="count hidden"></span></a>
      <a class="card big-link" href="/seller/products.html"><span>Products</span></a>
      <a class="card big-link" href="/seller/earnings.html"><span>Earnings</span></a>
      <a class="card big-link" href="/seller/settings.html"><span>Shop settings</span></a>
      <a id="store-link" class="card big-link hidden" href="/"><span>See your shop</span></a>
    </nav>
  </main>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
  <script src="/seller/home.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products - Bazaar Lane</title>
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-staff-header="seller"></header>

  <main>
    <h1>Products</h1>
    <div id="message" class="message" role="status"></div>
    <div id="shop-note" class="message error hidden" role="status"></div>
    <div id="low-banner" class="banner-low hidden" role="status"></div>

    <form id="product-form" class="card hidden" novalidate>
      <h2 id="form-title">Add a product</h2>
      <div class="form-grid">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" maxlength="60" required>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Choose a category</option>
          </select>
        </div>
        <div class="field">
          <label for="price">Price in rupees</label>
          <input id="price" type="text" inputmode="decimal" maxlength="10" placeholder="250 or 250.50" required>
        </div>
        <div class="field" id="stock-field">
          <label for="stock">Stock to start with</label>
          <input id="stock" type="number" inputmode="numeric" min="0" step="1" required>
        </div>
        <div class="field">
          <label for="low-stock">Low-stock level</label>
          <input id="low-stock" type="number" inputmode="numeric" min="0" step="1" value="5" required>
          <div class="hint">LOW shows when the stock is at or below this.</div>
        </div>
        <div class="field">
          <label for="size-label">Size or weight</label>
          <input id="size-label" maxlength="30" placeholder="250 g, 1 litre, 2 m x 1 m">
          <div class="hint">Shown under the name, so customers know how much they get.</div>
        </div>
        <div class="field wide">
          <label for="description">Description</label>
          <textarea id="description" rows="3" maxlength="500"></textarea>
        </div>
        <div class="field wide">
          <label class="choice"><input id="giftable" type="checkbox"> Giftable: show it in gift collections and gift searches</label>
        </div>
      </div>
      <div id="form-message" class="message" role="alert"></div>
      <div class="actions">
        <button type="submit" id="save-button">Add product</button>
        <button type="button" id="cancel-edit" class="secondary hidden">Cancel</button>
      </div>
    </form>

    <h2>Your products <span id="product-count" class="muted"></span></h2>
    <div id="product-list" class="grid"></div>
    <p id="no-products" class="muted hidden">No products yet. Add your first one above.</p>
  </main>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
  <script src="/seller/products.js" defer></script>
</body>
</html>

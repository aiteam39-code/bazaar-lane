<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earnings - Bazaar Lane</title>
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-staff-header="seller"></header>

  <main>
    <h1>Earnings</h1>
    <div id="message" class="message" role="status"></div>
    <section class="card" aria-labelledby="balance-title">
      <h2 id="balance-title">Your balance</h2>
      <p><span id="balance" class="kpi"></span></p>
      <p id="balance-words" class="small"></p>
      <p id="rate-line" class="small muted"></p>
    </section>
    <h2>Delivered orders</h2>
    <div class="table-scroll"><table class="split" id="order-table"></table></div>
    <p id="no-orders" class="muted hidden">Nothing delivered yet. Each order is booked here once it is delivered.</p>
    <h2>Payouts</h2>
    <ul id="payout-list" class="plain-list"></ul>
    <p id="no-payouts" class="muted hidden">No payouts yet.</p>
  </main>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
  <script src="/seller/earnings.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Bazaar Lane</title>
  <link rel="stylesheet" href="/kit/components/bundle.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" data-customer-header></header>

  <main class="narrow">
    <h1>Log in</h1>
    <p class="muted">For sellers and the admin. Customers do not need to log in.</p>

    <form id="login-form" class="card" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" maxlength="100" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" maxlength="100" required>
      </div>
      <div id="message" class="message" role="alert"></div>
      <button type="submit" class="wide">Log in</button>
    </form>

    <p>New seller? <a href="/seller/signup.html">Open a shop</a></p>
  </main>

  <footer class="site-footer" data-customer-footer></footer>

  <script src="/vendor/react.js" defer></script>
  <script src="/vendor/react-dom.js" defer></script>
  <script src="/kit/components/bundle.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/kit.js" defer></script>
  <script src="/login.js" defer></script>
</body>
</html>

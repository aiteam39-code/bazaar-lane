<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interaction Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .slab { fill: var(--accent); }
  .deep { fill: var(--inverse); }
  .amber { fill: var(--chart-3); }
  .ok { fill: var(--success); }
  .cut { fill: var(--accent-soft); }
  .ground { fill: var(--canvas); }
  .pick { fill: var(--accent); }
  .blk { rx: var(--radius-lg); }
  .pill { rx: 8px; }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 64px; line-height: 0.95; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 2px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 160x280 slab bled off the top, first in the box (the action colour people remember) · inverse 184x168 · chart-3 104x104 bleeding off the right edge · success as one 64x32 pill (it only ever means a state) — about 34% of 960x288
  arrangement one tall slab with satellites, every bottom on one line space-6 above the edge, space-4 gutters
  pattern     pills, from "Anything you press is a pill": rows of space-4-tall pills at a space-5 pitch on the inverse block, cut out in canvas with one accent pill selected per row like a size picker; three accent-soft pills cut into the slab
  scales      sides in space-2 multiples; gutters space-4; pitch space-5; block corners radius-lg; pills rx half of space-4
-->
<rect class="slab blk" x="16" y="-24" width="160" height="280" rx="20"/>
<rect class="pill cut" x="32" y="208" width="48" height="16" rx="8"/>
<rect class="pill cut" x="88" y="208" width="24" height="16" rx="8"/>
<rect class="pill cut" x="32" y="184" width="32" height="16" rx="8"/>
<rect class="deep blk" x="192" y="88" width="184" height="168" rx="20"/>
<rect class="pill ground" x="208" y="112" width="40" height="16" rx="8"/>
<rect class="pill pick" x="256" y="112" width="24" height="16" rx="8"/>
<rect class="pill ground" x="288" y="112" width="32" height="16" rx="8"/>
<rect class="pill ground" x="208" y="136" width="24" height="16" rx="8"/>
<rect class="pill ground" x="240" y="136" width="48" height="16" rx="8"/>
<rect class="pill pick" x="296" y="136" width="24" height="16" rx="8"/>
<rect class="pill ground" x="328" y="136" width="32" height="16" rx="8"/>
<rect class="pill pick" x="208" y="160" width="48" height="16" rx="8"/>
<rect class="pill ground" x="264" y="160" width="32" height="16" rx="8"/>
<rect class="pill ground" x="304" y="160" width="40" height="16" rx="8"/>
<rect class="pill ground" x="208" y="184" width="32" height="16" rx="8"/>
<rect class="pill ground" x="248" y="184" width="24" height="16" rx="8"/>
<rect class="pill pick" x="280" y="184" width="40" height="16" rx="8"/>
<rect class="pill ground" x="328" y="184" width="24" height="16" rx="8"/>
<rect class="pill ground" x="208" y="208" width="24" height="16" rx="8"/>
<rect class="pill pick" x="240" y="208" width="32" height="16" rx="8"/>
<rect class="pill ground" x="280" y="208" width="48" height="16" rx="8"/>
<rect class="ok" x="392" y="104" width="64" height="32" rx="16"/>
<rect class="amber blk" x="392" y="152" width="104" height="104" rx="20"/>
</svg>
</div>
<div class="words">
<h1 class="name">Interaction<br>Kit</h1>
<p class="tag">Commerce moments that confirm, never decorate.</p>
</div>
</div>
</body>
</html>

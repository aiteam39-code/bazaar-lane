<!-- @dsCard group="Cart & checkout" height=190 subtitle="Counts down to free delivery" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FreeShippingMeter — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>html, body { margin: 0; background: var(--canvas); }</style>
</head>
<body>
<div id="root" class="ik-stage"></div>
<script>
var IK = window.IK, h = React.createElement, useState = React.useState, useEffect = React.useEffect;
function Demo() {
  var s = useState(1149), sub = s[0], setSub = s[1];
  return h('div', { style: { display: 'grid', gap: 'var(--space-4)', maxWidth: 440 } },
    h(IK.FreeShippingMeter, { subtotal: sub, threshold: 1499 }),
    h('div', { className: 'ik-row', style: { justifyContent: 'space-between' } },
      h('span', { style: { font: '500 14px/20px var(--font-sans)', color: 'var(--ink-muted)' } }, 'Subtotal ',
        h(IK.RollingNumber, { value: sub, format: { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }, animateOnMount: false, style: { color: 'var(--ink)', fontWeight: 600 } })),
      h('div', { className: 'ik-row', style: { gap: 'var(--space-2)' } },
        h('button', { className: 'ik-ghost', onClick: function () { setSub(sub + 399); } }, '+ Candle \u20B9399'),
        h('button', { className: 'ik-ghost', onClick: function () { setSub(Math.max(0, sub - 399)); } }, '\u2212 Remove'))
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

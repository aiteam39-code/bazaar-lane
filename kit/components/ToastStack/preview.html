<!-- @dsCard group="Cart & checkout" height=300 subtitle="Stacked; point at it and it fans out" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ToastStack — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>html, body { margin: 0; background: var(--canvas); }</style>
</head>
<body>
<div id="root" class="ik-stage"></div>
<script>
var IK = window.IK, h = React.createElement, useState = React.useState, useEffect = React.useEffect;
var art = IK.demo.art;
function Demo() {
  var t = IK.useToasts();
  useEffect(function () {
    t.push({ title: 'Saved to wishlist', tone: 'success', duration: Infinity });
    t.push({ title: 'Payment declined', body: 'Try another card or UPI.', tone: 'danger', action: { label: 'Retry' }, duration: Infinity });
    t.push({ title: 'Added to bag', body: 'Hand-thrown mug \u00B7 \u20B91,299', thumb: art('mug'), action: { label: 'View bag' }, duration: Infinity });
  }, []);
  return h('div', { style: { display: 'flex', flexDirection: 'column', justifyContent: 'space-between', gap: 'var(--space-5)', minHeight: 240 } },
    h('div', { className: 'ik-row', style: { gap: 'var(--space-2)' } },
      h('button', { className: 'ik-ghost', onClick: function () { t.push({ title: 'Added to bag', body: 'Brass table lamp \u00B7 \u20B93,450', thumb: art('lamp'), action: { label: 'View bag' } }); } }, 'Add to bag'),
      h('button', { className: 'ik-ghost', onClick: function () { t.push({ title: 'Payment declined', body: 'Try another card or UPI.', tone: 'danger', action: { label: 'Retry' } }); } }, 'Fail a payment'),
      h('button', { className: 'ik-ghost', onClick: function () { t.push({ title: 'Saved to wishlist', tone: 'success' }); } }, 'Save an item')),
    h(IK.ToastStack, { toasts: t.toasts, onDismiss: t.dismiss, placement: 'inline' })
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
